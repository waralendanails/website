<!--
title: Work — waralenda
description: Portfolio — waralenda nail art, swatches and branded content. Filter by format, style and finish.
navCta: true
stickyCta: work-with-me
extraScript: work.js
-->

<main>

  <header class="page-header">
    <span class="eyebrow">Portfolio</span>
    <h1 class="heading-page">The <span class="accent">work.</span></h1>
  </header>

  <!-- ── FILTERS ── -->
  <div class="filter-section" id="filterSection" role="search" aria-label="Filter gallery">

    <!-- Mobile: collapsible toggle button -->
    <div class="filter-toggle-bar">
      <button class="filter-toggle-btn" id="filterToggle" onclick="toggleFilters()" aria-expanded="false" aria-controls="filterPanelInner">
        <span class="filter-toggle-label">Filter</span>
        <span class="filter-toggle-count" id="filterToggleCount" aria-live="polite"></span>
        <svg class="filter-toggle-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <polyline points="6,9 12,15 18,9"/>
        </svg>
      </button>
    </div>

    <!-- Filter panel — hidden on mobile by default, always visible on desktop -->
    <div class="filter-panel" id="filterPanelInner" aria-hidden="true">

      <!-- Format — single select -->
      <div class="filter-row">
        <span class="filter-label" id="label-format">Format</span>
        <div class="filter-pill-group filter-format-group" role="group" aria-labelledby="label-format">
          <button class="filter-pill format-active" id="fmt-all"
            onclick="setFormat('all',this)" aria-pressed="true">All</button>
          <button class="filter-pill" id="fmt-swatch"
            onclick="setFormat('swatch',this)" aria-pressed="false">Swatch</button>
          <button class="filter-pill" id="fmt-nailart"
            onclick="setFormat('nailart',this)" aria-pressed="false">Nail Art</button>
          <button class="filter-pill" id="fmt-unique"
            onclick="setFormat('unique',this)" aria-pressed="false">Unique</button>
        </div>
      </div>

      <!-- Style — multichoice, shown only when Nail Art selected -->
      <div class="filter-style-row" id="styleRow" aria-hidden="true">
        <span class="filter-label" id="label-style">Style</span>
        <div class="filter-pill-group" role="group" aria-labelledby="label-style">
          <button class="filter-pill" data-style="freehand"
            onclick="toggleStyle('freehand',this)" aria-pressed="false">Freehand</button>
          <button class="filter-pill" data-style="french"
            onclick="toggleStyle('french',this)" aria-pressed="false">French</button>
          <button class="filter-pill" data-style="gradient"
            onclick="toggleStyle('gradient',this)" aria-pressed="false">Gradient</button>
          <button class="filter-pill" data-style="negativespace"
            onclick="toggleStyle('negativespace',this)" aria-pressed="false">Negative Space</button>
          <button class="filter-pill" data-style="polkadot"
            onclick="toggleStyle('polkadot',this)" aria-pressed="false">Polka Dot</button>
          <button class="filter-pill" data-style="skittle"
            onclick="toggleStyle('skittle',this)" aria-pressed="false">Skittle</button>
          <button class="filter-pill" data-style="stamping"
            onclick="toggleStyle('stamping',this)" aria-pressed="false">Stamping</button>
          <button class="filter-pill" data-style="stripes"
            onclick="toggleStyle('stripes',this)" aria-pressed="false">Stripes</button>
          <button class="filter-pill" data-style="marble"
            onclick="toggleStyle('marble',this)" aria-pressed="false">Marble</button>
        </div>
      </div>

      <!-- Finish — multichoice -->
      <div class="filter-row">
        <span class="filter-label" id="label-finish">Finish</span>
        <div class="filter-pill-group" role="group" aria-labelledby="label-finish">
          <button class="filter-pill" data-finish="chrome"
            onclick="toggleFinish('chrome',this)" aria-pressed="false">Chrome</button>
          <button class="filter-pill" data-finish="cream"
            onclick="toggleFinish('cream',this)" aria-pressed="false">Cream</button>
          <button class="filter-pill" data-finish="flakie"
            onclick="toggleFinish('flakie',this)" aria-pressed="false">Flakie</button>
          <button class="filter-pill" data-finish="glitter"
            onclick="toggleFinish('glitter',this)" aria-pressed="false">Glitter</button>
          <button class="filter-pill" data-finish="holo"
            onclick="toggleFinish('holo',this)" aria-pressed="false">Holo</button>
          <button class="filter-pill" data-finish="iridescent"
            onclick="toggleFinish('iridescent',this)" aria-pressed="false">Iridescent</button>
          <button class="filter-pill" data-finish="jelly"
            onclick="toggleFinish('jelly',this)" aria-pressed="false">Jelly</button>
          <button class="filter-pill" data-finish="magnetic"
            onclick="toggleFinish('magnetic',this)" aria-pressed="false">Magnetic</button>
          <button class="filter-pill" data-finish="matte"
            onclick="toggleFinish('matte',this)" aria-pressed="false">Matte</button>
          <button class="filter-pill" data-finish="multichrome"
            onclick="toggleFinish('multichrome',this)" aria-pressed="false">Multichrome</button>
          <button class="filter-pill" data-finish="neon"
            onclick="toggleFinish('neon',this)" aria-pressed="false">Neon</button>
          <button class="filter-pill" data-finish="reflective"
            onclick="toggleFinish('reflective',this)" aria-pressed="false">Reflective</button>
          <button class="filter-pill" data-finish="shimmer"
            onclick="toggleFinish('shimmer',this)" aria-pressed="false">Shimmer</button>
          <button class="filter-pill" data-finish="thermal"
            onclick="toggleFinish('thermal',this)" aria-pressed="false">Thermal</button>
          <button class="filter-pill" data-finish="topper"
            onclick="toggleFinish('topper',this)" aria-pressed="false">Topper</button>
        </div>
      </div>

    </div><!-- /filter-panel -->

  </div>

  <!-- ── RESULT COUNT ── -->
  <div class="filter-count">
    <div class="filter-count-num">
      <span class="accent" id="countNum"></span> images
    </div>
    <button class="filter-count-reset" onclick="resetFilters()" aria-label="Clear all filters">
      Clear filters
    </button>
  </div>

  <!-- ── GALLERY ── -->
  <!--
    HOW TO ADD IMAGES:
    Each .gallery-item needs:
      data-format="swatch" OR "nailart" OR "unique"
      data-style=""  (blank for swatches) OR space-separated styles e.g. "skittle freehand"
      data-finish="holo glitter" (space-separated list of all finishes that apply)

    Example:
    <div class="gallery-item"
         data-format="swatch"
         data-style=""
         data-finish="holo multichrome">
      <img class="gallery-item-img"
           src="https://res.cloudinary.com/dvf8iwjri/image/upload/f_auto,q_auto,w_1200/image-name.jpg"
           alt="Descriptive alt text"
           loading="lazy">
      <div class="gallery-item-tags">
        <span class="tag tag-format">Swatch</span>
        <span class="tag tag-finish">Holo · Multichrome</span>
      </div>
    </div>
  -->
  <div class="gallery-grid" id="galleryGrid" aria-live="polite" aria-label="Filtered gallery">

    <!-- Empty state -->
    <div class="gallery-empty" id="galleryEmpty" aria-live="polite">
      <p class="gallery-empty-text">No images match that combination.</p>
    </div>

  </div>
</main>
